# ============================================================
# 本地开发配置示例
#
# 使用方法：
#   1. 复制本文件为 application-local.yml（同目录）
#   2. 把下面的占位符替换成你自己的密钥
#   3. application-local.yml 已被 .gitignore 忽略，禁止提交到仓库
#
# 说明：
#   - application.yml 里 spring.profiles.active=local，因此本地启动会自动读取 application-local.yml
#   - 线上部署请使用 application-prod.yml + 环境变量，见 docs/部署方案.md
# ============================================================

langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: YOUR_DEEPSEEK_API_KEY
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
      max-tokens: 8192
      # 本机/网关会协商 br 压缩导致响应体解析失败，强制 gzip
      custom-headers:
        Accept-Encoding: gzip
      # 结构化输出，json 格式
      strict-json-schema: true
      response-format: json_object
      max-retries: 3
    streaming-chat-model: # 流式输出必须配置
      base-url: https://api.deepseek.com
      api-key: YOUR_DEEPSEEK_API_KEY
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
      max-tokens: 8192
      custom-headers:
        Accept-Encoding: gzip
    # 推理模型（复杂推理任务，多例模式提高并发）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: YOUR_DEEPSEEK_API_KEY
      model-name: deepseek-reasoner
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true
      custom-headers:
        Accept-Encoding: gzip

# redis（本地开发默认带密码，按自己的 redis 修改）
spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: YOUR_REDIS_PASSWORD
      ttl: 3600

# 腾讯云 COS 对象存储（素材库 / 应用封面截图）
cos:
  client:
    host: https://YOUR_BUCKET.cos.ap-guangzhou.myqcloud.com
    secretId: YOUR_COS_SECRET_ID
    secretKey: YOUR_COS_SECRET_KEY
    region: ap-guangzhou
    bucket: YOUR_BUCKET_NAME
