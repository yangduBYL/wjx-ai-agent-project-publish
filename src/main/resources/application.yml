spring:
  application:
    name: wjx-ai-agent-project-back
server:
  port: 8123
  servlet:
    # 上下文路径
    context-path: /api

# springdoc-openapi项目配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.wjx.wjxaiagentprojectback.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn