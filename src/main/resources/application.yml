spring:
  application:
    name: wjx-ai-agent-project-back
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wjx_ai_code_project
    username: root
    password: 123456
  #redis
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0 # 补充此行配置
      ttl: 3600 # 默认过期时间
  #session配置（主要用于长期保存用户信息，减少频繁登录
  session:
    store-type: redis
    #session 15天过期）
    timeout: 1296000
  # 文件上传限制（素材库图片上传，默认只有 1MB 不够用）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  profiles:
    active: local
server:
  port: 8123
  servlet:
    # 上下文路径
    context-path: /api
    #cookie 15天过期
    session:
      cookie:
        max-age: 1296000

# springdoc-openapi项目配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.wjx.wjxaiagentprojectback.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn